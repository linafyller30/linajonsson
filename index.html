<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-årsfest Jeopardy</title>
    <!-- Importera Garamond-typsnitt -->
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'EB Garamond', serif;
            background-color: #E6E6FA; /* Ljus lavendel */
            color: #2D3748;
        }

        /* Kategorifärger */
        .category-music { background-color: #EF4444; color: white; }
        .category-childhood { background-color: #3B82F6; color: white; }
        .category-cake { background-color: #EC4899; color: white; }
        .category-random { background-color: #FBBF24; color: black; }

        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease-in-out;
        }

        .card-shadow:hover:not(.used) {
            transform: scale(1.05);
            filter: brightness(1.1);
            cursor: pointer;
        }

        .used {
            background-color: #CBD5E0 !important;
            color: #A0AEC0 !important;
            cursor: default;
            transform: none;
            box-shadow: none;
            border-color: transparent !important;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.1s;
        }

        /* Stress-blinkningar vid shotrunda */
        .stress-flash-active {
            animation: intense-flash-bg 0.1s infinite;
        }

        @keyframes intense-flash-bg {
            0% { background-color: rgba(220, 38, 38, 1); }
            50% { background-color: rgba(255, 255, 255, 1); }
            100% { background-color: rgba(220, 38, 38, 1); }
        }

        .card-flash-active {
            animation: intense-flash-card 0.1s infinite !important;
            border: 15px solid black !important;
        }

        @keyframes intense-flash-card {
            0% { background-color: #ffffff; color: #dc2626; }
            50% { background-color: #dc2626; color: #ffffff; }
            100% { background-color: #ffffff; color: #dc2626; }
        }

        #setup-screen {
            position: fixed;
            inset: 0;
            background-color: #E6E6FA;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #timer-bar {
            transition: width 1s linear, background-color 0.3s;
        }

        .shot-alert-anim {
            animation: text-bounce 0.3s infinite;
        }

        @keyframes text-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .stop-shot-btn {
            animation: pulse-button 0.5s infinite;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        @keyframes pulse-button {
            0% { transform: scale(1); background-color: #fbbf24; }
            50% { transform: scale(1.05); background-color: #f59e0b; }
            100% { transform: scale(1); background-color: #fbbf24; }
        }

        /* Bild-styling för Hear me out cake */
        .image-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
            width: 100%;
        }

        .question-image {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background-color: #f9fafb;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #e5e7eb;
        }

        .grid-1 { grid-template-columns: minmax(200px, 450px); }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(2, 1fr); }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <!-- Startskärm: Ange lagnamn -->
    <div id="setup-screen" class="p-6">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border-4 border-double border-indigo-100">
            <h2 class="text-4xl font-bold mb-6 italic">Vilka tävlar?</h2>
            <div class="space-y-4 mb-8">
                <input type="text" id="team1-input" placeholder="Lag 1" class="w-full p-3 border-2 border-indigo-100 rounded-xl outline-none focus:border-indigo-400" value="Lag Solsken">
                <input type="text" id="team2-input" placeholder="Lag 2" class="w-full p-3 border-2 border-indigo-100 rounded-xl outline-none focus:border-indigo-400" value="Bubbelsällskapet">
                <input type="text" id="team3-input" placeholder="Lag 3" class="w-full p-3 border-2 border-indigo-100 rounded-xl outline-none focus:border-indigo-400" value="Frågvisa Gänget">
                <input type="text" id="team4-input" placeholder="Lag 4" class="w-full p-3 border-2 border-indigo-100 rounded-xl outline-none focus:border-indigo-400" value="30-plussarna">
            </div>
            <button onclick="startGame()" class="bg-indigo-600 text-white px-10 py-4 rounded-full text-2xl font-bold hover:bg-indigo-700 w-full transition-transform hover:scale-105">Starta Spelet</button>
        </div>
    </div>

    <!-- Header -->
    <div class="max-w-7xl mx-auto mb-8">
        <div class="flex flex-col lg:flex-row items-center justify-between gap-6">
            <div class="text-center lg:text-left">
                <h1 class="text-5xl font-bold tracking-tight uppercase">30-Års Jeopardy</h1>
                <p class="italic text-xl text-indigo-800">Ta en shot för att stjäla frågan vid 0s eller vid FEL svar!</p>
            </div>
            <div id="team-display" class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full lg:w-auto"></div>
        </div>
    </div>

    <!-- Spelplan -->
    <div class="max-w-7xl mx-auto grid grid-cols-4 gap-3 md:gap-4">
        <div class="category-music p-5 rounded-t-xl text-center font-bold text-lg md:text-2xl shadow-md uppercase">Musik</div>
        <div class="category-childhood p-5 rounded-t-xl text-center font-bold text-lg md:text-2xl shadow-md uppercase">Barndom</div>
        <div class="category-cake p-5 rounded-t-xl text-center font-bold text-lg md:text-2xl shadow-md uppercase">Hear me out cake</div>
        <div class="category-random p-5 rounded-t-xl text-center font-bold text-lg md:text-2xl shadow-md uppercase text-shadow">Random</div>
        <div id="game-board-contents" class="contents"></div>
    </div>

    <!-- Frågemodal -->
    <div id="modal" class="modal-overlay">
        <div id="modal-card" class="bg-white p-6 md:p-10 rounded-3xl max-w-4xl w-full text-center relative card-shadow border-8 border-double border-indigo-50 transition-all overflow-y-auto max-h-[90vh]">
            
            <div id="timer-container" class="mb-6">
                <div class="flex justify-center items-center mb-2">
                    <span id="timer-text" class="text-3xl font-bold text-gray-400">30s</span>
                </div>
                <div class="w-full bg-gray-100 h-4 rounded-full overflow-hidden">
                    <div id="timer-bar" class="bg-indigo-500 h-full w-full"></div>
                </div>
            </div>

            <div id="modal-category-tag" class="inline-block px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest mb-2">Kategori</div>
            <div id="modal-value" class="text-2xl mb-4 font-bold text-gray-400 italic">500p</div>
            
            <div id="shot-notice" class="hidden mb-6">
                <p class="text-6xl md:text-8xl font-black shot-alert-anim text-red-600 leading-none">🔥🍶🔥 SHOT! 🔥🍶🔥</p>
                <p class="text-2xl font-bold text-red-800 mt-6 uppercase bg-yellow-300 inline-block px-6 py-2 shadow-xl transform -rotate-2 italic">Svep först för att STJÄLA frågan!</p>
            </div>

            <div id="image-container" class="hidden image-grid"></div>

            <div id="question-text" class="text-2xl md:text-4xl mb-8 min-h-[50px] flex items-center justify-center font-bold leading-tight relative z-10">
                Laddar fråga...
            </div>
            
            <div id="answer-text" class="hidden text-2xl md:text-4xl mb-12 text-indigo-600 font-bold border-t-2 border-dashed pt-8">
                Laddar svar...
            </div>

            <div id="modal-footer" class="flex flex-col gap-4 relative z-10 pb-4">
                <!-- Initiala kontroller -->
                <div id="pre-shot-controls" class="flex justify-center">
                    <button id="team-answered-btn" class="bg-yellow-400 text-black px-12 py-6 rounded-2xl text-3xl hover:bg-yellow-500 transition-all font-black border-b-8 border-yellow-600">
                        LAG SVARAR! 🛑
                    </button>
                </div>

                <!-- Knapp för att stoppa stöld-rundan -->
                <button id="shot-taken-btn" class="hidden stop-shot-btn bg-yellow-400 text-black px-10 py-8 rounded-2xl text-4xl font-black border-b-8 border-orange-600 mb-2">
                    DE TOG SHOTTEN! 🥃
                </button>

                <!-- Efter att någon tryckt svara eller stulit -->
                <div id="action-buttons" class="hidden flex flex-col gap-4">
                    <button id="show-answer-btn" class="bg-indigo-600 text-white px-10 py-4 rounded-full text-2xl hover:bg-indigo-700 transition-all font-bold">Visa svar</button>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <button onclick="showTeamSelection()" class="bg-green-500 text-white px-6 py-4 rounded-2xl hover:bg-green-600 font-bold text-xl border-b-4 border-green-700">Rätt (+ poäng)</button>
                        
                        <!-- Öppna för stöld om det var fel -->
                        <button id="fail-trigger-btn" class="bg-red-600 text-white px-6 py-4 rounded-2xl hover:bg-red-700 transition-all font-black border-b-4 border-red-800 text-xl">
                            FEL! (STJÄL VIA SHOT) 🥃
                        </button>

                        <button onclick="closeModal(null)" class="bg-gray-500 text-white px-6 py-4 rounded-2xl hover:bg-gray-600 font-bold text-xl border-b-4 border-gray-700">Ingen fick rätt</button>
                    </div>
                </div>

                <!-- Val av lag -->
                <div id="team-selector" class="hidden flex flex-col gap-4">
                    <p class="text-xl font-bold text-gray-600">Vem vann poängen?</p>
                    <div id="team-selection-grid" class="grid grid-cols-2 gap-3"></div>
                    <button onclick="backToActions()" class="text-sm text-gray-400 underline">Tillbaka</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cakeQuestionText = "Vem är linas hear me out cake av dessa?";
        const gameData = {
            music: [
                { v: 500, q: "Denna grupp toppade listorna året födelsedagsbarnet föddes.", a: "Spice Girls", imgs: ["https://upload.wikimedia.org/wikipedia/en/0/01/SpiceGirlsSpiceAlbumcover.png"] },
                { v: 400, q: "Denna Britney Spears-låt släpptes 1998.", a: "...Baby One More Time" },
                { v: 300, q: "Vilket boyband hade de mest dedikerade fansen?", a: "Backstreet Boys" },
                { v: 200, q: "Detta bärbara sätt att lyssna på musik ersatte kassetten.", a: "Discman" },
                { v: 100, q: "Vilken färg hade de populära 'HitClips'-spelarna?", a: "Olika neonfärger" }
            ],
            childhood: [
                { v: 500, q: "I detta program bodde en björn i ett hus fullt av roliga saker.", a: "Björnes Magasin", imgs: ["https://image.spreadshirtmedia.net/image-server/v1/products/T210A2PA4301PT17X46Y38D1016834185W2498H2998/views/1,width=378,height=378,appearanceId=2,backgroundColor=F2F2F2/bjoerne-och-snigel-maen-premium-t-shirt.jpg"] },
                { v: 400, q: "Vilken smak hade de klassiska 'Sura Patronerna'?", a: "Citron" },
                { v: 300, q: "Dessa små plastfigurer med färgglatt hår satt på pennorna.", a: "Lyckotroll" },
                { v: 200, q: "Vilket digitalt husdjur krävde mat dygnet runt?", a: "Tamagotchi" },
                { v: 100, q: "Vad hette den blå bollen som fastnade på allt?", a: "Klibb-boll" }
            ],
            cake: [
                { v: 500, q: cakeQuestionText, a: "Svaret på alla 4", imgs: ["500p_a.jpg", "500p_b.jpg", "500p_c.jpg", "500p_d.jpg"] },
                { v: 400, q: cakeQuestionText, a: "Svaret på alla 3", imgs: ["400p_a.jpg", "400p_b.jpg", "400p_c.jpg"] },
                { v: 300, q: cakeQuestionText, a: "Svaret på alla 3", imgs: ["300p_a.jpg", "300p_b.jpg", "300p_c.jpg"] },
                { v: 200, q: cakeQuestionText, a: "Svaret på alla 3", imgs: ["200p_a.jpg", "200p_b.jpg", "200p_c.jpg"] },
                { v: 100, q: cakeQuestionText, a: "Svaret på alla 2", imgs: ["100p_a.jpg", "100p_b.jpg"] }
            ],
            random: [
                { v: 500, q: "Hur många koppar kaffe krävs en måndag?", a: "Minst 3 koppar" },
                { v: 400, q: "Vilken är hennes största rädsla?", a: "Spindlar" },
                { v: 300, q: "Om hon vann 1 miljon, vad bokar hon?", a: "Resa till Maldiverna" },
                { v: 200, q: "Vad är hennes mest använda emoji?", a: "😂" },
                { v: 100, q: "Vilket plagg i garderoben borde slängts 2014?", a: "Mjukisbyxorna" }
            ]
        };

        let teams = [];
        let activeQuestionValue = 0;
        let activeCardElement = null;
        let timerInterval = null;
        let timeLeft = 30;

        function startGame() {
            teams = [
                { name: document.getElementById('team1-input').value || 'Lag 1', score: 0 },
                { name: document.getElementById('team2-input').value || 'Lag 2', score: 0 },
                { name: document.getElementById('team3-input').value || 'Lag 3', score: 0 },
                { name: document.getElementById('team4-input').value || 'Lag 4', score: 0 }
            ];
            updateTeamDisplay();
            document.getElementById('setup-screen').style.display = 'none';
            initBoard();
        }

        function updateTeamDisplay() {
            const display = document.getElementById('team-display');
            display.innerHTML = '';
            teams.forEach(team => {
                const teamEl = document.createElement('div');
                teamEl.className = 'bg-white p-4 rounded-xl shadow-md border-b-4 border-indigo-500 text-center min-w-[120px]';
                teamEl.innerHTML = `<p class="text-xs uppercase text-gray-400 font-bold truncate">${team.name}</p><p class="text-2xl font-bold text-indigo-700">${team.score}</p>`;
                display.appendChild(teamEl);
            });
        }

        function initBoard() {
            const board = document.getElementById('game-board-contents');
            board.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                ['music', 'childhood', 'cake', 'random'].forEach(cat => {
                    const q = gameData[cat][i];
                    const card = document.createElement('div');
                    card.className = `category-${cat === 'cake' ? 'cake' : cat} p-6 md:p-10 text-center text-3xl md:text-4xl font-bold card-shadow rounded-lg border-2 border-transparent`;
                    card.innerText = q.v;
                    card.onclick = () => openQuestion(cat, i, card);
                    board.appendChild(card);
                });
            }
        }

        function openQuestion(cat, index, el) {
            if (el.classList.contains('used')) return;
            activeCardElement = el;
            const data = gameData[cat][index];
            activeQuestionValue = data.v;
            
            document.getElementById('modal-category-tag').innerText = cat.replace('music','Musik').replace('childhood','Barndom').replace('cake','Hear me out cake').replace('random','Random');
            document.getElementById('modal-category-tag').className = `inline-block px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest mb-2 category-${cat === 'cake' ? 'cake' : cat}`;
            document.getElementById('modal-value').innerText = `${activeQuestionValue} poäng`;
            document.getElementById('question-text').innerText = data.q;
            document.getElementById('answer-text').innerText = data.a;
            
            const imgContainer = document.getElementById('image-container');
            imgContainer.innerHTML = '';
            if (data.imgs && data.imgs.length > 0) {
                imgContainer.className = `image-grid grid-${data.imgs.length}`;
                data.imgs.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.className = 'question-image';
                    img.onerror = () => { img.alt = "Bild: " + src; img.classList.add('bg-gray-100','p-2'); }; 
                    imgContainer.appendChild(img);
                });
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }

            // Återställ UI
            document.getElementById('answer-text').classList.add('hidden');
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('team-selector').classList.add('hidden');
            document.getElementById('show-answer-btn').classList.remove('hidden');
            
            document.getElementById('pre-shot-controls').classList.remove('hidden');
            document.getElementById('shot-taken-btn').classList.add('hidden');
            
            document.getElementById('modal-card').classList.remove('modal-pulse', 'card-flash-active');
            document.getElementById('modal').classList.remove('stress-flash-active');
            document.getElementById('shot-notice').classList.add('hidden');
            document.getElementById('timer-text').classList.remove('text-red-600');
            
            document.getElementById('modal').style.display = 'flex';
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            const bar = document.getElementById('timer-bar');
            const text = document.getElementById('timer-text');
            bar.style.width = '100%';
            bar.className = 'bg-indigo-500 h-full w-full';
            text.innerText = "30s";
            timerInterval = setInterval(() => {
                timeLeft--;
                text.innerText = timeLeft + "s";
                const percentage = (timeLeft / 30) * 100;
                bar.style.width = percentage + "%";
                if (timeLeft <= 10) {
                    bar.classList.replace('bg-indigo-500', 'bg-red-500');
                    text.classList.add('text-red-600');
                }
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    triggerShotRule();
                }
            }, 1000);
        }

        function triggerShotRule() {
            clearInterval(timerInterval);
            document.getElementById('modal-card').classList.add('modal-pulse', 'card-flash-active');
            document.getElementById('modal').classList.add('stress-flash-active');
            document.getElementById('shot-notice').classList.remove('hidden');
            document.getElementById('timer-text').innerText = "SVEP!";
            
            document.getElementById('pre-shot-controls').classList.add('hidden');
            document.getElementById('action-buttons').classList.add('hidden'); 
            document.getElementById('shot-taken-btn').classList.remove('hidden');
        }

        document.getElementById('fail-trigger-btn').onclick = triggerShotRule;

        function stopEverything() {
            clearInterval(timerInterval);
            document.getElementById('modal').classList.remove('stress-flash-active');
            document.getElementById('modal-card').classList.remove('modal-pulse', 'card-flash-active');
            document.getElementById('shot-notice').classList.add('hidden');
            
            document.getElementById('pre-shot-controls').classList.add('hidden');
            document.getElementById('shot-taken-btn').classList.add('hidden');
            
            document.getElementById('action-buttons').classList.remove('hidden');
        }

        document.getElementById('team-answered-btn').onclick = stopEverything;
        document.getElementById('shot-taken-btn').onclick = stopEverything;

        document.getElementById('show-answer-btn').onclick = () => {
            document.getElementById('answer-text').classList.remove('hidden');
            document.getElementById('show-answer-btn').classList.add('hidden');
        };

        function showTeamSelection() {
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('team-selector').classList.remove('hidden');
            const grid = document.getElementById('team-selection-grid');
            grid.innerHTML = '';
            teams.forEach((team, i) => {
                const btn = document.createElement('button');
                btn.className = 'bg-indigo-100 hover:bg-indigo-600 hover:text-white p-4 rounded-xl font-bold transition-all truncate border-2 border-indigo-200';
                btn.innerText = team.name;
                btn.onclick = () => closeModal(i);
                grid.appendChild(btn);
            });
        }

        function backToActions() {
            document.getElementById('team-selector').classList.add('hidden');
            document.getElementById('action-buttons').classList.remove('hidden');
        }

        function closeModal(winner) {
            clearInterval(timerInterval);
            document.getElementById('modal').classList.remove('stress-flash-active');
            if (winner !== null) {
                teams[winner].score += activeQuestionValue;
                updateTeamDisplay();
            }
            activeCardElement.classList.add('used');
            activeCardElement.innerText = "✓";
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
